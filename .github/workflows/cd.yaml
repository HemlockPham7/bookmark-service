name: cd-pipeline
on:
  workflow_run:
    workflows: ["ci-pipeline"]
    types:
      - completed

jobs:
  cd_pipeline:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          mkdir -p ./deployment/shorten-url-deployment
          echo "${{ secrets.BOOKMARK_SERVICE_ENV }}" > ./deployment/shorten-url-deployment/bookmark-service/.env

      - name: login to docker
        working-directory: ./deployment/shorten-url-deployment
        run: make docker-login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy Bookmark Service
        working-directory: ./deployment/shorten-url-deployment
        run: |
          echo "Deploying bookmark-service..."
          
          docker rm -f bookmark-service
          docker compose pull bookmark-service
          docker compose up -d bookmark-service
          
          docker system prune -f